{% extends 'inventario/base.html' %}
{% block title %}Eliminar producto{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-danger shadow-sm">
      <div class="card-body p-4">
        <h3 class="text-danger">Confirmar eliminación</h3>
        <p>¿Seguro que quieres eliminar <strong>{{ object.nombre }}</strong>? Esta acción no se puede deshacer.</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Sí, eliminar</button>
          <a href="{% url 'producto_lista' %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
